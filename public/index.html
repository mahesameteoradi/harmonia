<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmonia — Music Player</title>
    <meta name="description" content="Harmonia — pemutar musik pribadi tanpa iklan, tanpa langganan.">
    <link rel="icon" href="/media/logo.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand-header">
                <img src="/media/logo.jpg" alt="Harmonia" class="app-logo">
                <h2 class="text-gradient" style="margin: 0; font-size: 1.25rem;">Harmonia</h2>
            </div>
            
            <p class="nav-section-label">Menu</p>
            <nav style="display: flex; flex-direction: column; gap: 0.25rem; flex: 1;">
                <a href="#library" class="nav-link" data-route="library">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    Library
                </a>
                <a href="#playlists" class="nav-link" data-route="playlists">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    Playlists
                </a>
                <a href="#import" class="nav-link" data-route="import">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Import
                </a>
                
                <div style="flex: 1;"></div>
                
                <a href="#" class="nav-link" id="logout-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="main-view" class="main-content">
            <!-- Isi dirender oleh router.js -->
        </main>
    </div>

    <!-- Player Bar -->
    <footer class="player-bar">
        <div class="player-track-info">
            <div class="player-cover">🎵</div>
            <div style="min-width: 0;">
                <div class="player-track-name">Belum ada lagu</div>
                <div class="player-track-artist">Pilih lagu untuk diputar</div>
            </div>
        </div>
        
        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn" title="Shuffle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="player-btn" title="Previous">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                </button>
                <button class="player-btn player-btn-play" title="Play">
                    <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                </button>
                <button class="player-btn" title="Next">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                </button>
                <button class="player-btn" title="Repeat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
            <div class="player-progress">
                <span class="player-progress-time">0:00</span>
                <div class="player-progress-bar">
                    <div class="player-progress-fill"></div>
                </div>
                <span class="player-progress-time">0:00</span>
            </div>
        </div>
        
        <div class="player-extra">
            <button class="player-btn" title="Volume">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
            <input type="range" class="volume-slider" min="0" max="100" value="75">
        </div>
    </footer>

    <!-- Env Vars -->
    <script src="/js/env.js"></script>
    
    <!-- App Logic (ESM) -->
    <script type="module">
        import { supabase } from '/js/supabase.js';
        import '/js/auth.js';
        import { initRouter } from '/js/router.js';
        
        initRouter();
        
        document.getElementById('logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
        });
    </script>
</body>
</html>
